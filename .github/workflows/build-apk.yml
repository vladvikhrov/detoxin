name: Build release APK

# Сборка запускается при публикации тега версии, например: git tag v1.0 && git push origin v1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Подпись из секретов репозитория (Settings → Secrets and variables → Actions):
      #   RELEASE_KEYSTORE_BASE64  — base64 от release.jks (base64 -w0 release.jks)
      #   RELEASE_STORE_PASSWORD, RELEASE_KEY_PASSWORD
      # Без секретов сборка только проверяется: APK с debug-подписью в релиз НЕ публикуется,
      # подписанный APK автор загружает вручную (ключ не покидает его компьютер).
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=detoxin_key"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not set: build is verified only, the APK is not published."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        if: steps.signing.outputs.signed == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk "detoxin-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        if: steps.signing.outputs.signed == 'true'
        with:
          files: detoxin-${{ github.ref_name }}.apk
          generate_release_notes: true
